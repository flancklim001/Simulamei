<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimulaMEI - Calculadora de Elegibilidade MEI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; width: 100%; text-align: center; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 10px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 20px; text-align: center; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #219150; }
        .result { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        .mei { background-color: #e8f8f5; color: #27ae60; border: 1px solid #27ae60; }
        .simples { background-color: #fef9e7; color: #d35400; border: 1px solid #d35400; }
        .cta-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .btn-bling { background-color: #2980b9; }
        .btn-contabilizei { background-color: #e67e22; }
    </style>
</head>
<body>
    <div class="card">
        <h1>SimulaMEI</h1>
        <p>Informe o seu faturamento mensal estimado para saber qual é o melhor enquadramento para o seu negócio.</p>
        <input type="number" id="faturamento" placeholder="Ex: 5000" min="0">
        <button onclick="calcular()">Simular Agora</button>

        <div id="result" class="result">
            <h3 id="result-title"></h3>
            <p id="result-desc"></p>
            <a id="cta-link" href="#" target="_blank" class="cta-btn"></a>
        </div>
    </div>

    <script>
        function calcular() {
            const valor = parseFloat(document.getElementById('faturamento').value);
            const resultDiv = document.getElementById('result');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const cta = document.getElementById('cta-link');

            if (isNaN(valor) || valor <= 0) {
                alert('Por favor, insira um valor válido.');
                return;
            }

            const faturamentoAnual = valor * 12;
            resultDiv.style.display = 'block';

            if (faturamentoAnual <= 81000) {
                resultDiv.className = 'result mei';
                title.innerText = 'Você pode ser MEI!';
                desc.innerText = 'O seu faturamento anual estimado é de R$ ' + faturamentoAnual.toLocaleString('pt-BR') + ', estando dentro do limite de R$ 81.000,00.';
                cta.innerText = 'Abrir MEI com Bling';
                cta.className = 'cta-btn btn-bling';
                cta.href = 'https://www.bling.com.br';
            } else {
                resultDiv.className = 'result simples';
                title.innerText = 'Recomendado: Simples Nacional';
                desc.innerText = 'O seu faturamento anual estimado é de R$ ' + faturamentoAnual.toLocaleString('pt-BR') + ', ultrapassando o limite do MEI.';
                cta.innerText = 'Abrir Empresa com Contabilizei';
                cta.className = 'cta-btn btn-contabilizei';
                cta.href = 'https://www.contabilizei.com.br';
            }
        }
    </script>
</body>
</html>
